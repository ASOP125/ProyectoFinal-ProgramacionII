<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Logística y Envíos</title>
    <style>
        :root {
            --main-color: #811F1D;
            --bg: #f5f5f5;
            --panel: #ffffff;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #login-box {
            background: var(--panel);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }
        h2 {
            color: var(--main-color);
        }
        input {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: var(--main-color);
            color: white;
            padding: 0.6rem;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            opacity: 0.9;
        }
        #login-error {
            color: red;
            margin-top: 0.5rem;
            height: 1.2rem;
        }
    </style>
</head>
<body>

<div id="login-box">
    <h2>Iniciar Sesión</h2>
    <input type="text" id="username" placeholder="Usuario" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button id="login-btn">Ingresar</button>
    <div id="login-error"></div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/v1/auth/login';

    document.getElementById('login-btn').addEventListener('click', async () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('login-error');
        errorDiv.textContent = '';

        if (!username || !password) {
            errorDiv.textContent = 'Ingresa usuario y contraseña';
            return;
        }

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json','Accept': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            console.log(res)

            if (!res.ok) {
                errorDiv.textContent = 'Usuario o contraseña incorrectos';
                return;
            }

            const data = await res.json();
            localStorage.setItem('token', data.token);
            window.location.href = 'index.html';
        } catch (e) {
            errorDiv.textContent = '⚠️ Error de conexión con el servidor';
        }
    });
</script>

</body>
</html>
